version: "3.9"

services:
  vault:
    image: hashicorp/vault:latest
    container_name: vault_prod
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_API_ADDR: http://0.0.0.0:8200
      VAULT_UNSEAL_KEY: ${VAULT_UNSEAL_KEY}
    ports:
      - "8200:8200"
    restart: always
    volumes:
      - ./vault/policies:/vault/policies:ro
      - ./vault/data:/vault/data
      - ./vault/config:/vault/config:ro
      - ./docker-init/vault-auto-unseal.sh:/vault/auto-unseal.sh:ro
      - ./docker-init/vault-entrypoint.sh:/vault/entrypoint.sh:ro
    cap_add:
      - IPC_LOCK
    entrypoint: ["/bin/sh", "/vault/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
